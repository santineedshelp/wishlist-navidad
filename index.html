<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishList Navideña</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎄 WishList Navideña 🎁</h1>
    <p>Elegí una carpeta para ver qué regalar o armá tu propia lista</p>
  </header>

  <main class="container">
    <!-- VISTA 1: CARPETAS DE TODOS -->
    <section id="vista-carpetas">
      <div class="nueva-carpeta-box">
        <input type="text" id="input-nombre-carpeta" placeholder="Ej: WishList Mari">
        <button id="btn-crear-carpeta">+ Crear Carpeta</button>
      </div>

      <div id="grid-carpetas" class="grid-carpetas"></div>
    </section>

    <!-- VISTA 2: PRODUCTOS DENTRO DE UNA CARPETA -->
    <section id="vista-productos" class="oculto">
      <div class="header-carpeta">
        <button id="btn-volver" class="btn-secundario">← Volver a carpetas</button>
        <h2 id="titulo-carpeta-actual">WishList</h2>
      </div>

      <div class="form-producto">
        <div class="fila-link">
          <input type="url" id="input-link-ml" placeholder="1) Pegá acá el link de Mercado Libre...">
          <button id="btn-autocompletar" class="btn-secundario">✨ Autocompletar</button>
        </div>

        <div class="fila-datos">
          <input type="text" id="input-titulo" placeholder="Nombre del producto">
          <input type="text" id="input-precio" placeholder="Precio (ej: $ 45.000)">
          <input type="url" id="input-imagen" placeholder="Link de la foto (opcional)">
        </div>

        <div class="fila-preview">
          <img id="preview-img" class="preview-img oculto" alt="Vista previa">
          <button id="btn-agregar-producto">🎁 Agregar Regalo</button>
        </div>
      </div>
      <p id="estado-carga" class="estado-texto"></p>

      <div id="grid-productos" class="grid-productos"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
